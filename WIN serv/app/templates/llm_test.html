<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тест LLM — Overlay Translation Server</title><style>body{font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 15% 0,#172554 0,transparent 32%),#080d18;color:#e8eef9;margin:0;min-height:100vh}.wrap{max-width:1180px;margin:0 auto;padding:38px 22px 70px}.card{background:rgba(17,24,39,.88);border:1px solid rgba(148,163,184,.16);border-radius:16px;padding:24px;margin:18px 0;box-shadow:0 16px 45px rgba(0,0,0,.2)}h1{font-size:30px;margin:0 0 6px}.muted{color:#91a0b7;font-size:13px}.error{color:#fca5a5}button{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border:0;border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer;margin-right:8px}button:disabled{opacity:.55;cursor:wait}.chosen{background:rgba(34,197,94,.08)}.model-choice{accent-color:#22c55e;cursor:pointer}.history-list{display:none;max-height:320px;overflow:auto;margin-top:16px}.history-list.visible{display:block}.history-row{display:block;width:100%;margin:0 0 8px;padding:9px;background:#182235;border-radius:8px}.history-row small{display:block;color:#91a0b7}.selected-list{margin-top:12px}.selected-item{border-top:1px solid #263244;padding:9px 0}.remove{float:right;padding:4px 8px;background:#263244}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{text-align:left;vertical-align:top;border-top:1px solid #263244;padding:12px 8px;white-space:pre-wrap}th[data-sort]{cursor:pointer;user-select:none}.result-item{min-height:32px;padding:7px 0;border-top:1px solid #263244;box-sizing:border-box}.result-item:first-child{border-top:0}.model-link{padding:0;background:none;box-shadow:none;color:#7dd3fc;text-align:left}.test-history{background:#0b1220;padding:14px}.test-run{border-top:1px solid #263244;padding:10px 0}.test-run:first-child{border-top:0}a{color:#7dd3fc}</style></head><body><div class="wrap"><p><a href="/admin">← Админка</a></p><h1>Сравнение моделей</h1><div class="card"><button id="pick">Выбрать фразы из истории</button><button id="run" disabled>Тестировать модели</button><button id="stop" disabled>Остановить</button><span id="progress" class="muted"></span> <span id="test-status" class="muted">Готово</span><div id="history-list" class="history-list"></div><div id="selected-list" class="selected-list"><p class="muted">Фразы не выбраны.</p></div><p id="error" class="error">{{ error }}</p><table><thead><tr><th data-sort="selected">[]</th><th data-sort="model">Модель</th><th data-sort="translation">Ответы</th><th data-sort="time">Время ответа</th><th data-sort="average">Среднее время</th></tr></thead><tbody></tbody></table>{% if not models and not error %}<p class="muted">Провайдер не вернул моделей.</p>{% endif %}</div></div><script>const models={{ models|tojson }};let currentModel={{ selected_model|tojson }};let selected=[],rows=[],stopped=false,running=false,sortColumn=null,sortDirection='asc';const pick=document.getElementById('pick'),run=document.getElementById('run'),stop=document.getElementById('stop'),progress=document.getElementById('progress'),testStatus=document.getElementById('test-status'),error=document.getElementById('error'),historyList=document.getElementById('history-list'),selectedList=document.getElementById('selected-list'),body=document.querySelector('tbody'),headers=[...document.querySelectorAll('th[data-sort]')];function esc(v){const n=document.createElement('span');n.textContent=v;return n.innerHTML}function renderSelected(){selectedList.innerHTML=selected.length?selected.map(item=>`<div class="selected-item" data-id="${item.id}"><button class="remove" type="button">Удалить</button><div>Оригинал: ${esc(item.source_text)}</div><div class="muted">Исходный перевод: ${esc(item.translation)}</div></div>`).join(''):'<p class="muted">Фразы не выбраны.</p>';selectedList.querySelectorAll('.remove').forEach(button=>button.onclick=()=>{selected=selected.filter(item=>item.id!==Number(button.closest('[data-id]').dataset.id));renderSelected();buildRows()})}function buildRows(){body.replaceChildren();rows=[];for(const model of models){const row=document.createElement('tr');row.dataset.model=model;row.results=selected.map(phrase=>({phrase_id:phrase.id,translation:null,duration_ms:null,error:null}));if(model===currentModel)row.classList.add('chosen');row.innerHTML=`<td><input class="model-choice" type="radio" name="selected-model" title="Выбрать модель" ${model===currentModel?'checked':''}></td><td><button class="model-link" type="button">${esc(model)}</button></td><td class="answers"></td><td class="times"></td><td class="average muted">—</td>`;rows.push(row);body.append(row);renderModel(row);bindModelHistory(row)}bindChoices();sortRows();run.disabled=!selected.length}function successfulAverage(row){const values=row.results.filter(result=>result.duration_ms!=null&&!result.error).map(result=>Number(result.duration_ms));return values.length?values.reduce((sum,value)=>sum+value,0)/values.length:null}function renderModel(row){const answers=row.querySelector('.answers'),times=row.querySelector('.times'),average=successfulAverage(row);if(!row.results.length){answers.innerHTML='<div class="result-item muted">—</div>';times.innerHTML='<div class="result-item muted">—</div>';row.querySelector('.average').textContent='—';return}answers.innerHTML=row.results.map(result=>`<div class="result-item ${result.error?'error':result.translation?'':'muted'}">${esc(result.error||result.translation||'—')}</div>`).join('');times.innerHTML=row.results.map(result=>`<div class="result-item muted">${result.duration_ms==null?'':result.duration_ms+' мс'}</div>`).join('');row.querySelector('.average').textContent=average==null?'—':average.toFixed(2)+' мс'}async function bindModelHistory(row){row.querySelector('.model-link').onclick=async()=>{if(row.detailRow){row.detailRow.remove();row.detailRow=null;return}const detail=document.createElement('tr');detail.innerHTML='<td colspan="5" class="test-history muted">Загрузка…</td>';row.detailRow=detail;row.after(detail);try{const response=await fetch('/llm-test/model-history?model='+encodeURIComponent(row.dataset.model)),runs=await response.json();if(!response.ok)throw new Error(runs.detail||'Не удалось загрузить предыдущие тесты');detail.querySelector('td').innerHTML='<b>Предыдущие тесты</b>'+(!runs.length?'<p>Нет сохранённых тестов.</p>':runs.map(run=>`<div class="test-run"><div>${esc(run.created_at)} · ${run.phrase_count} фраз · среднее ${run.average_ms==null?'—':run.average_ms+' мс'}</div>${run.results.map(item=>`<div class="result-item ${item.error?'error':''}">${esc(item.source_text)} → ${esc(item.error||item.translation||'—')} ${item.duration_ms==null?'':'· '+item.duration_ms+' мс'}</div>`).join('')}</div>`).join(''))}catch(e){detail.querySelector('td').textContent=e.message}}}function bindChoices(){rows.forEach(row=>row.querySelector('.model-choice').onchange=async event=>{const model=row.dataset.model,previous=currentModel;event.target.disabled=true;try{const response=await fetch('/llm-test/select',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model})}),data=await response.json();if(!response.ok)throw new Error(data.detail||'Не удалось выбрать модель');currentModel=data.model;rows.forEach(item=>item.classList.toggle('chosen',item.dataset.model===currentModel));rows.forEach(item=>item.querySelector('.model-choice').checked=item===row);sortRows()}catch(e){currentModel=previous;rows.forEach(item=>item.classList.toggle('chosen',item.dataset.model===currentModel));{const old=rows.find(item=>item.dataset.model===currentModel);if(old)old.querySelector('.model-choice').checked=true};error.textContent=e.message}finally{event.target.disabled=false}})}function value(row){if(sortColumn==='selected')return row.dataset.model===currentModel?1:0;if(sortColumn==='model')return row.dataset.model;if(sortColumn==='translation'){const first=row.results[0];return first?(first.error||first.translation||''):''}if(sortColumn==='time'||sortColumn==='average')return successfulAverage(row)}function sortRows(){if(!sortColumn)return;const dir=sortDirection==='asc'?1:-1;rows.sort((a,b)=>{const av=value(a),bv=value(b);if((sortColumn==='time'||sortColumn==='average')&&(av===null||bv===null))return av===bv?0:av===null?1:-1;const n=sortColumn==='selected'?bv-av:typeof av==='number'?av-bv:String(av).localeCompare(String(bv),undefined,{sensitivity:'base'});return n*dir});body.replaceChildren(...rows.flatMap(row=>row.detailRow?[row,row.detailRow]:[row]));headers.forEach(h=>h.textContent=h.dataset.sort==='selected'?'[]':h.dataset.sort==='model'?'Модель':h.dataset.sort==='translation'?'Ответы':h.dataset.sort==='time'?'Время ответа':'Среднее время');headers.find(h=>h.dataset.sort===sortColumn).textContent+=' '+(sortDirection==='asc'?'↑':'↓')}headers.forEach(h=>h.onclick=()=>{sortDirection=sortColumn===h.dataset.sort&&sortDirection==='asc'?'desc':'asc';sortColumn=h.dataset.sort;sortRows()});pick.onclick=async()=>{error.textContent='';try{const response=await fetch('/llm-test/history-entries'),data=await response.json();if(!response.ok)throw new Error(data.detail||'Не удалось загрузить историю');historyList.innerHTML=data.map(item=>`<label class="history-row"><input type="checkbox" value="${item.id}" ${selected.some(x=>x.id===item.id)?'checked':''}><small>${esc(item.source_name||item.source_id)}</small><div>${esc(item.source_text)}</div><small>Перевод: ${esc(item.translation)}</small></label>`).join('')+'<button id="apply-history" type="button">Добавить выбранные</button>';const byId=new Map(data.map(item=>[String(item.id),item])),syncSelection=()=>{selected=[...historyList.querySelectorAll('input:checked')].map(x=>byId.get(x.value));renderSelected();buildRows()};historyList.querySelectorAll('input[type=checkbox]').forEach(input=>input.onchange=syncSelection);document.getElementById('apply-history').onclick=()=>{syncSelection();historyList.classList.remove('visible')};historyList.classList.add('visible')}catch(e){error.textContent=e.message}};stop.onclick=()=>{stopped=true;stop.disabled=true;testStatus.textContent='Остановлено'};run.onclick=async()=>{if(running||!selected.length)return;running=true;stopped=false;buildRows();run.disabled=true;pick.disabled=true;stop.disabled=false;error.textContent='';const testRunId=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();let done=0,total=models.length*selected.length;progress.textContent=`Выполнено ${done} / ${total}`;for(const model of models){for(const phrase of selected){if(stopped)break;const row=rows.find(item=>item.dataset.model===model),result=row.results.find(item=>item.phrase_id===phrase.id);result.translation='Выполняется…';renderModel(row);const waitStarted=performance.now(),updateWaiting=()=>testStatus.textContent=stopped?'Остановлено':`В процессе — ожидаю ответ от ${model} — ${((performance.now()-waitStarted)/1000).toFixed(1)} с`;updateWaiting();const waitingTimer=setInterval(updateWaiting,100);try{const response=await fetch('/llm-test/'+phrase.id+'/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model,test_run_id:testRunId})}),data=await response.json();if(!response.ok)throw new Error(data.detail||'Ошибка');result.translation=data.translation;result.duration_ms=data.duration_ms;result.error=null}catch(e){result.translation=null;result.duration_ms=null;result.error=e.message}finally{clearInterval(waitingTimer)}done++;progress.textContent=`Выполнено ${done} / ${total}`;renderModel(row);sortRows()}if(stopped)break}running=false;pick.disabled=false;run.disabled=false;stop.disabled=true;testStatus.textContent=stopped?'Остановлено':'Завершено'};buildRows();</script></body></html>
