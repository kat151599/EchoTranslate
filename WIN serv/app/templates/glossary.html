<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Глоссарий — {{ source_name }}</title><style>body{font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 15% 0,#172554 0,transparent 32%),#080d18;color:#e8eef9;margin:0;min-height:100vh}.wrap{max-width:1180px;margin:0 auto;padding:38px 22px 70px}.card{background:rgba(17,24,39,.88);border:1px solid rgba(148,163,184,.16);border-radius:16px;padding:24px;margin:18px 0;box-shadow:0 16px 45px rgba(0,0,0,.2)}h1{font-size:30px;margin:0 0 6px}h2{font-size:18px;margin:0 0 14px}.muted{color:#91a0b7;font-size:13px}input,select{background:#0b1220;color:#fff;border:1px solid #334155;border-radius:8px;padding:8px;max-width:100%;box-sizing:border-box}button{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border:0;border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer;box-shadow:0 5px 15px rgba(37,99,235,.22);transition:.18s}button:hover{transform:translateY(-1px);filter:brightness(1.08)}.danger{background:#7f1d1d}.warn{color:#fbbf24}table{width:100%;border-collapse:collapse}th,td{border-top:1px solid #263244;padding:10px 7px;text-align:left;vertical-align:top}a{color:#7dd3fc}@media(max-width:700px){.wrap{padding:24px 14px 50px}.card{padding:17px}table{font-size:13px}th,td{padding:8px 4px}}</style></head><body><div class="wrap"><p><a href="/history/{{ source_id }}"><button type="button">← История</button></a></p><h1>Глоссарий: {{ source_name }}</h1><p class="muted">Записей: {{ entries|length }} · checkpoint: {{ state.glossary_scanned_until_history_id }} · новых tokens: {{ state.glossary_pending_tokens }}</p><div class="card"><form method="post" action="/history/{{ source_id }}/glossary/scan"><button>Проанализировать сейчас</button></form></div><div class="card"><h2>Добавить</h2><form method="post" action="/history/{{ source_id }}/glossary/save"><input name="source_text" placeholder="Оригинал" required> <input name="translation" placeholder="Перевод" required> <select name="type"><option>PERSON</option><option>LOCATION</option><option>ORG</option><option>TITLE</option><option>ITEM</option><option selected>TERM</option></select> <button>Сохранить</button></form></div><div class="card"><table><tr><th>Оригинал</th><th>Перевод</th><th>Тип</th><th>Статус</th><th>Действия</th></tr>{% for e in entries %}<tr{% if e.status == 'CONFLICT' %} class="warn"{% endif %}><td><input form="entry-{{ e.id }}" name="source_text" value="{{ e.source_text }}"></td><td><input form="entry-{{ e.id }}" name="translation" value="{{ e.translation }}"></td><td><select form="entry-{{ e.id }}" name="type">{% for t in ['PERSON','LOCATION','ORG','TITLE','ITEM','TERM'] %}<option{% if e.type==t %} selected{% endif %}>{{ t }}</option>{% endfor %}</select></td><td>{{ e.status }}</td><td><form id="entry-{{ e.id }}" method="post" action="/history/{{ source_id }}/glossary/save"><input type="hidden" name="id" value="{{ e.id }}"><button>Редактировать</button></form><form style="display:inline" method="post" action="/history/{{ source_id }}/glossary/{{ e.id }}/delete"><button class="danger">Удалить</button></form></td></tr>{% endfor %}</table></div></div></body></html>
