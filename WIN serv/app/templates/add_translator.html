<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Добавить переводчик</title>
<style>body{font-family:Inter,Segoe UI,Arial,sans-serif;background:#080d18;color:#e8eef9;margin:0;min-height:100vh}.wrap{max-width:720px;margin:0 auto;padding:38px 22px}.card{background:#111827;border:1px solid #263244;border-radius:16px;padding:24px}h1{margin-top:0}label{display:block;font-size:13px;color:#aab8cf;margin:16px 0 6px}input,select{width:100%;box-sizing:border-box;background:#0b1220;color:#f8fafc;border:1px solid #334155;border-radius:9px;padding:11px 12px}button{background:#2563eb;color:#fff;border:0;border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer;margin:14px 8px 0 0}.secondary{background:#263244}.status{min-height:20px;color:#aab8cf}.error{color:#fca5a5}</style></head>
<body><div class="wrap"><div class="card"><h1>Добавить переводчик</h1><form id="translator-form" method="post" action="/admin/translators/new"><label>Имя переводчика</label><input name="profile_name" required placeholder="Например, DeepSeek"><label>Адрес LLM API</label><input id="llm-base-url" name="llm_base_url" type="url" required placeholder="https://api.example.com/v1"><label>LLM API key</label><input id="llm-api-key" name="llm_api_key" type="password" autocomplete="new-password"><button type="button" id="load-models">Получить список моделей</button><span id="models-status" class="status"></span><label>Модель</label><select id="llm-model" name="llm_model" required><option value="">Сначала получите список моделей</option></select><input id="llm-models" type="hidden" name="llm_models" value="[]"><p><button type="submit">Сохранить переводчик</button><a href="/admin"><button class="secondary" type="button">Назад</button></a></p></form></div></div><script>
const baseUrl=document.getElementById('llm-base-url'),apiKey=document.getElementById('llm-api-key'),model=document.getElementById('llm-model'),modelsInput=document.getElementById('llm-models'),loadModels=document.getElementById('load-models'),status=document.getElementById('models-status');
loadModels.addEventListener('click',async()=>{status.className='status';status.textContent='Загрузка…';model.innerHTML='<option value="">Загрузка…</option>';try{const data=new FormData();data.set('llm_base_url',baseUrl.value);data.set('llm_api_key',apiKey.value);const response=await fetch('/api/admin/llm-models',{method:'POST',body:data}),payload=await response.json();if(!response.ok)throw new Error(payload.detail||'Не удалось получить модели');const models=payload.models||[];modelsInput.value=JSON.stringify(models);model.innerHTML=models.length?models.map(item=>{const option=document.createElement('option');option.value=item;option.textContent=item;return option.outerHTML}).join(''):'<option value="">Модели не найдены</option>';status.textContent=models.length?`Доступно моделей: ${models.length}`:'Модели не найдены'}catch(error){modelsInput.value='[]';model.innerHTML='<option value="">Не удалось загрузить модели</option>';status.className='status error';status.textContent=error.message}});
</script></body></html>
